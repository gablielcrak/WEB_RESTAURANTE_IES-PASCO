    <header>
        <div class="logo"><h1>🍳 Sabores del Mundo</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre_el_restaurante.html">Nosotros</a></li>

            </ul>
        </nav>
    </header>

    <main class="reserva-container">
        <h2>Reserva tu Mesa en Línea</h2>
        
        <form action="procesar_reserva.php" method="POST" class="form-reserva">
            
            <div class="campo-grupo">
                <label>Nombre Completo:</label>
                <input type="text" name="nombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="fila-doble">
                <div class="campo-grupo">
                    <label>Correo Electrónico:</label>
                    <input type="email" name="correo" required placeholder="juan@correo.com">
                </div>
                <div class="campo-grupo">
                    <label>Teléfono Celular:</label>
                    <input type="tel" name="telefono" required placeholder="Ej. 987654321">
                </div>
            </div>

            <div class="fila-doble">
                <div class="campo-grupo">
                    <label>Fecha de la Cita:</label>
                    <input type="date" name="fecha" required>
                </div>
                <div class="campo-grupo">
                    <label>Hora:</label>
                    <input type="time" name="hora" required>
                </div>
            </div>

            <div class="campo-grupo">
                <label>Número de Comensales:</label>
                <select name="personas" required>
                    <option value="1">1 Persona</option>
                    <option value="2" selected>2 Personas</option>
                    <option value="4">4 Personas</option>
                    <option value="6">6 Personas</option>
                </select>
            </div>

            <button type="submit" class="btn-enviar-reserva">Confirmar Reservación</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Restaurante Sabores del Mundo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
