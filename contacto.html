    <meta charset="UTF-8">

<body>

    <header>
        <div class="logo">
            <h1>🍳 Sabores del Mundo</h1>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre_el_restaurante.html">Nosotros</a></li>

    <section class="contact-section" style="height: 70vh; display: flex; flex-direction: column; justify-content: center;">
        <h2>Reserva tu Mesa Especial</h2>
        <p style="margin-bottom: 20px;">Rellena los datos para asegurar tu espacio gastronómico.</p>
        
        <form class="contact-form">
            <input type="text" placeholder="Tu Nombre Completo" required>
            <input type="email" placeholder="Tu Correo Electrónico" required>
            <input type="date" required>
            <input type="time" required>
            <input type="number" placeholder="Número de Personas" min="1" max="10" required>
            <button type="submit" class="btn">Confirmar Mi Reserva</button>
        </form>
    </section>

    <footer>
