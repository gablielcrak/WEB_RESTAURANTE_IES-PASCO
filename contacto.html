    <section style="padding: 40px 10%; max-width: 600px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 20px;">Reserva tu Mesa</h2>
        
        <form action="procesar_reserva.php" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <label>Nombre Completo:
                <input type="text" name="nombre_completo" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </label>
            <label>Correo Electrónico:
                <input type="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </label>
            <div style="display: flex; gap: 10px;">
                <label style="flex: 1;">Fecha:
                    <input type="date" name="fecha" required style="width: 100%; padding: 8px; margin-top: 5px;">

                <label style="flex: 1;">Hora:
                    <input type="time" name="hora" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </label>
            </div>
            <label>Número de Personas:
                <input type="number" name="num_personas" min="1" max="15" value="2" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </label>
            <button type="submit" style="background: #d4af37; color:#1a1a1a; padding: 12px; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px;">Confirmar Reservación</button>
        </form>
