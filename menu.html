    <link rel="stylesheet" href="CSS/menu.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN (HEADER) -->
    <header>
        <div class="logo"><h1>🍳 Sabores del Mundo</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre_el_restaurante.html">Nosotros</a></li>
                <li><a href="menu.html" class="active">Menú</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="consultar_cuenta.html">Ver Mi Cuenta</a></li>
                <li><a href="contacto.html" class="btn-nav">Reservar Mesa</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <div class="container">
            <h2>Sabores del Mundo</h2>
            <p class="subtitle">Sistema Automatizado de Comandas v1.0</p>
            
            <!-- Formulario conectado a validar_mesa.php -->
            <form action="validar_mesa.php" method="POST" class="form-comanda">
                
                <div class="campo-grupo">
                    <label for="id_mesa">Seleccione su Mesa:</label>
                    <select name="id_mesa" id="id_mesa" required class="input-menu-grande">
                        <option value="" disabled selected>-- Elige una mesa --</option>
                        <option value="1">Mesa 1</option>
                        <option value="2">Mesa 2</option>
                        <option value="3">Mesa 3</option>
                        <option value="4">Mesa 4</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="id_platillo">Seleccione el Platillo:</label>
                    <select name="id_platillo" id="id_platillo" required class="input-menu-grande">
                        <option value="" disabled selected>-- Elige un platillo gourmet --</option>
                        <option value="1">Ceviche Clásico — S/. 25.00</option>
                        <option value="2">Lomo Saltado — S/. 30.00</option>
                        <option value="3">Pachamanca Pasqueña — S/. 35.00</option>
                        <option value="4">Chicha Morada 1L — S/. 12.00</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="cantidad">Cantidad / Porciones:</label>
                    <input type="number" name="cantidad" id="cantidad" min="1" max="10" value="1" required class="input-menu-grande">
                </div>

                <button type="submit" class="btn-enviar-comanda">Enviar Comanda a Cocina 🚀</button>
            </form>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer>

    </footer>

</body>
