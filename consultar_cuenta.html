            <h2>Ver Mi Cuenta</h2>
            <p class="subtitle">Introduce tu número de mesa para ver el desglose del consumo actual</p>
            
            <!-- Usamos el método GET para enviar la mesa por la URL hacia ver_cuenta.php -->
            <form action="ver_cuenta.php" method="GET" class="form-comanda">
                <div class="campo-grupo">
                    <label for="mesa">Seleccione su Mesa:</label>
                    <select name="mesa" id="mesa" required class="input-menu-grande">
                        <option value="" disabled selected>-- Elige tu mesa --</option>
                        <option value="1">Mesa 1</option>
                        <option value="2">Mesa 2</option>
                        <option value="3">Mesa 3</option>
                        <option value="4">Mesa 4</option>
                    </select>
                </div>

                <button type="submit" class="btn-enviar-comanda">🔍 Consultar Estado de Cuenta</button>
            </form>
