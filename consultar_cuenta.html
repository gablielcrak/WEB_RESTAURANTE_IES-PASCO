<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Mi Cuenta - Sabores del Mundo</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contacto.css"> <style>
        .caja-consulta-container { padding: 60px 10%; max-width: 500px; margin: 0 auto; text-align: center; }
        .caja-consulta-container h2 { font-size: 28px; margin-bottom: 10px; color: #111; }
        .caja-consulta-container p { color: #666; font-size: 14px; margin-bottom: 30px; }
        .input-mesa-grande { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 20px; text-align: center; font-weight: bold; width: 100%; outline: none; margin-top: 5px; }
        .input-mesa-grande:focus { border-color: #d4af37; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><h1>🍳 Sabores del Mundo</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre_el_restaurante.html">Nosotros</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="consultar_cuenta.html" class="active">🔍 Ver Mi Cuenta</a></li>
                <li><a href="contacto.html" class="btn-nav">Reservar Mesa</a></li>
            </ul>
        </nav>
    </header>

    <main class="caja-consulta-container">
        <h2>🧾 Ver Mi Cuenta</h2>
        <p>Introduce tu número de mesa para revisar el desglose de tus pedidos en tiempo real.</p>
        
        <div class="form-reserva">
            <div class="campo-grupo">
                <label>Número de tu Mesa:</label>
                <input type="number" id="num_mesa_cliente" min="1" placeholder="Ej. 4" required class="input-mesa-grande">
            </div>
            <button type="button" onclick="buscarCuentaMesa()" class="btn-enviar-reserva" style="margin-top: 10px;">Visualizar Consumo</button>
        </div>
    </main>

    <script>
        function buscarCuentaMesa() {
            const mesa = document.getElementById('num_mesa_cliente').value;
            if(mesa > 0) {
                // Redirecciona al archivo PHP pasando la variable de la mesa
                window.location.href = 'ver_cuenta.php?mesa=' + mesa;
            } else {
                alert('🚨 Por favor, introduce un número de mesa válido.');
            }
        }
    </script>

    <footer>
        <p>&copy; 2026 Restaurante Sabores del Mundo.</p>
    </footer>

</body>
</html>
